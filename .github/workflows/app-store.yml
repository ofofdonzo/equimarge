name: Envoi sur l'App Store

# Construit, signe et envoie l'application sur App Store Connect (TestFlight puis validation Apple).
# Lancement à la main : GitHub > Actions > « Envoi sur l'App Store » > Run workflow.
# Secrets à créer (GitHub > Settings > Secrets and variables > Actions), voir docs/app-store/README.md :
#   APPLE_TEAM_ID                 identifiant d'équipe Apple Developer (10 caractères)
#   APP_STORE_CONNECT_KEY_ID      identifiant de la clé d'API App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID   identifiant de l'émetteur (Issuer ID)
#   APP_STORE_CONNECT_PRIVATE_KEY contenu du fichier AuthKey_XXXX.p8
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Secrets présents
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "Secret manquant : $v (voir docs/app-store/README.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-mobile.mjs
      - run: npx cap sync ios
      - name: Clé d'API (fichier temporaire, supprimé à la fin)
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "Secret manquant : APP_STORE_CONNECT_PRIVATE_KEY"; exit 1; fi
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive signée
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Equimarge.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Envoi sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Equimarge.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
