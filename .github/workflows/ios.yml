name: iOS

# Vérifie que l'application iPhone se construit (simulateur, sans signature) à chaque modification qui la concerne.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'mobile/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'scripts/build-mobile.mjs', 'app/tableau-de-bord/conformite/**', 'components/**', 'lib/**', 'app/globals.css', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'mobile/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'scripts/build-mobile.mjs', 'app/tableau-de-bord/conformite/**', 'components/**', 'lib/**', 'app/globals.css', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pages de l'application
        run: node scripts/build-mobile.mjs
      - name: Copie dans le projet iOS
        run: npx cap sync ios
      - name: Version de Xcode
        run: xcodebuild -version
      - name: Construction pour le simulateur
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build
