name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : le build ne contacte pas Supabase
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secrets
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Application mobile (pages intégrées, valeurs publiques de netlify.toml)
        run: node scripts/build-mobile.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
